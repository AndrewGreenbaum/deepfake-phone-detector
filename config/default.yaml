# Default configuration for Phone Deepfake Detector
# Override with: python train.py --config config/custom.yaml

# =============================================================================
# Model Configuration
# =============================================================================
model:
  # Architecture: phone_cnn, temporal, mobile, attention
  name: mobile

  # Dropout rate for regularization
  dropout: 0.3

# =============================================================================
# Audio Configuration (Phone Quality)
# =============================================================================
audio:
  # Phone call standard sample rate
  sample_rate: 8000

  # Telephone frequency band
  low_freq: 300
  high_freq: 3400

  # Mel spectrogram settings
  n_mels: 64
  n_fft: 512
  hop_length: 256

  # Sample duration in seconds
  duration: 3.0

# =============================================================================
# Phone Degradation Pipeline
# =============================================================================
degradation:
  # Enable phone degradation during training
  enabled: true

  # Probability of applying each degradation
  noise_prob: 0.7
  codec_prob: 0.9
  packet_loss_prob: 0.3
  echo_prob: 0.2

# =============================================================================
# Training Configuration
# =============================================================================
training:
  # Number of epochs
  epochs: 50

  # Batch size
  batch_size: 32

  # Learning rate
  learning_rate: 0.0001

  # Weight decay (L2 regularization)
  weight_decay: 0.00001

  # Gradient clipping max norm
  grad_clip: 1.0

  # Random seed for reproducibility
  seed: 42

  # Early stopping patience (epochs without improvement)
  patience: 10

  # Mixed precision training (AMP) - faster on GPU
  use_amp: true

  # Gradient accumulation steps (effective_batch = batch_size * grad_accum)
  grad_accum_steps: 1

  # Learning rate warmup epochs
  warmup_epochs: 5

  # Use class weights for imbalanced datasets
  use_class_weights: true

  # Learning rate scheduler
  scheduler:
    type: cosine  # cosine, step, plateau
    T_max: 50     # For cosine
    eta_min: 0.000001

# =============================================================================
# Data Configuration
# =============================================================================
data:
  # Path to dataset root
  path: data

  # Train/val/test split ratios
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

  # Number of data loading workers
  num_workers: 4

  # Use pre-degraded audio (faster training)
  pre_degraded: false

# =============================================================================
# Output Configuration
# =============================================================================
output:
  # Checkpoint directory
  checkpoint_dir: checkpoints

  # TensorBoard log directory (null = auto-generate)
  log_dir: null

  # Save frequency (epochs)
  save_every: 5

# =============================================================================
# Evaluation Configuration
# =============================================================================
evaluation:
  # Detection threshold for FAKE classification
  threshold: 0.5

  # Output directory for evaluation results
  output_dir: evaluation_results
